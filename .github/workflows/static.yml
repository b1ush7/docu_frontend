# 把前端构建产物部署到 GitHub Pages
#
# 关键修复（原工作流的问题）：
#   旧版本直接 upload artifact `path: '.'`，也就是把**整个仓库源码**原样传到 Pages。
#   源码里的 index.html 引用的是 /src/main.ts（TypeScript 源文件），
#   浏览器既取不到该路径（站点在 /docu_frontend/ 子路径下），也无法执行 .ts，
#   结果 index.html 能下载、JS 加载 404 → #app 永远为空 → 白屏。
#   现在补上真正的构建步骤，只上传 dist 产物。
name: Deploy static content to Pages

on:
  # 推送到默认分支时部署
  push:
    branches: ["master"]

  # 允许在 Actions 页面手动触发
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 先构建，再部署：两者分开，构建失败时不会用坏产物覆盖线上
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 按锁文件安装依赖，避免部署时静默改变依赖版本。
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: API flow regression
        run: npm test

      # 类型检查与生产构建均通过后才允许上传。
      - name: Build
        run: npm run build

      # SPA 回退：GitHub Pages 对未知路径返回 404，
      # 把 index.html 复制为 404.html 后，直接访问 /docu_frontend/login
      # 或在子路由刷新时仍能由前端路由接管（vue-router 使用 BASE_URL 作为 base）。
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 只上传构建产物，不再上传整个仓库源码
          path: './dist'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
